---
name: ci

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64

    steps:
    - name: Checkout project
      uses: actions/checkout@master
      with:
        submodules: recursive

    - name: Build project
      run: |
          git config --global --add safe.directory '*' && \
          
          git submodule update --init --remote && \
          make -C libnx install -j$(nproc) && \
          make -j2
          make nro -j2
          mkdir dist/atmosphere/contents/420000000007E5AC/ -p
          mkdir dist/switch -p
          cp minFS.nro dist/switch/minFS.nro
          cp minFS.nsp dist/atmosphere/contents/420000000007E5AC/exefs.nsp
          cp toolbox.json dist/atmosphere/contents/420000000007E5AC/
          touch dist/atmosphere/contents/420000000007E5AC/boot2.flag
          cd dist
          zip -r ../minFS.zip .
          
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        path: minFS.zip
        
    - name: Upload binaries to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.release_token }}
        file: minFS.zip
        tag: ${{ github.ref }}
        overwrite: true
        file_glob: true
        make_latest: true 
        release_name: ${{ github.event.repository.updated_at }}
